<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Vaporwave banner: striped sun over neon grid">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b001a"/>
      <stop offset="0.55" stop-color="#1a003a"/>
      <stop offset="0.72" stop-color="#3d1052"/>
      <stop offset="0.74" stop-color="#12002b"/>
      <stop offset="1" stop-color="#0b001a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffb96"/>
      <stop offset="0.45" stop-color="#ff9a3c"/>
      <stop offset="0.75" stop-color="#ff71ce"/>
      <stop offset="1" stop-color="#b967ff"/>
    </linearGradient>
    <clipPath id="sunClip"><circle cx="600" cy="235" r="120"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff71ce" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff71ce" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- Sao trời -->
  <g fill="#e8d5ff">
    <circle cx="90" cy="60" r="1.4" opacity="0.9"/><circle cx="180" cy="110" r="1" opacity="0.5"/>
    <circle cx="260" cy="40" r="1.2" opacity="0.7"/><circle cx="340" cy="90" r="0.9" opacity="0.45"/>
    <circle cx="440" cy="55" r="1.3" opacity="0.8"/><circle cx="760" cy="45" r="1.1" opacity="0.6"/>
    <circle cx="850" cy="100" r="1.4" opacity="0.85"/><circle cx="950" cy="60" r="1" opacity="0.5"/>
    <circle cx="1040" cy="120" r="1.3" opacity="0.75"/><circle cx="1130" cy="70" r="1.1" opacity="0.55"/>
    <circle cx="70" cy="170" r="0.9" opacity="0.4"/><circle cx="1150" cy="180" r="1" opacity="0.45"/>
  </g>

  <!-- Mặt trời kẻ sọc -->
  <rect x="440" y="180" width="320" height="220" fill="url(#glow)"/>
  <circle cx="600" cy="235" r="120" fill="url(#sun)"/>
  <g clip-path="url(#sunClip)" fill="#12002b">
    <rect x="470" y="238" width="260" height="4"/>
    <rect x="470" y="254" width="260" height="7"/>
    <rect x="470" y="273" width="260" height="11"/>
    <rect x="470" y="296" width="260" height="16"/>
    <rect x="470" y="323" width="260" height="22"/>
  </g>

  <!-- Chân trời phát sáng -->
  <line x1="0" y1="290" x2="1200" y2="290" stroke="#ff71ce" stroke-width="2" opacity="0.85"/>

  <!-- Lưới phối cảnh -->
  <g stroke="#b967ff" stroke-width="1" opacity="0.55">
    <line x1="600" y1="290" x2="120"  y2="400"/><line x1="600" y1="290" x2="280"  y2="400"/>
    <line x1="600" y1="290" x2="440"  y2="400"/><line x1="600" y1="290" x2="600"  y2="400"/>
    <line x1="600" y1="290" x2="760"  y2="400"/><line x1="600" y1="290" x2="920"  y2="400"/>
    <line x1="600" y1="290" x2="1080" y2="400"/>
  </g>
  <g stroke="#01cdfe" fill="none" opacity="0.8">
    <line x1="0" y1="298" x2="1200" y2="298"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="332" x2="1200" y2="332" stroke-width="1.4"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke-width="1.8"/>
    <line x1="0" y1="396" x2="1200" y2="396" stroke-width="2.4"/>
  </g>

  <!-- Tiêu đề glitch sắc ký -->
  <g font-family="'Courier New', monospace" text-anchor="middle">
    <text x="600" y="96" font-size="46" font-weight="bold" fill="#ff71ce" opacity="0.75" transform="translate(-2 0)">LOVELYYELLOWCAT</text>
    <text x="600" y="96" font-size="46" font-weight="bold" fill="#01cdfe" opacity="0.75" transform="translate(2 0)">LOVELYYELLOWCAT</text>
    <text x="600" y="96" font-size="46" font-weight="bold" fill="#f5ecff">LOVELYYELLOWCAT</text>
    <text x="600" y="128" font-size="15" fill="#a08cc0" letter-spacing="6">A CYBERNETIC OASIS // EST. 1995</text>
  </g>

  <!-- Scanline phủ nhẹ -->
  <g fill="#000000" opacity="0.10">
    <rect x="0" y="0" width="1200" height="2"/><rect x="0" y="6" width="1200" height="2"/>
    <rect x="0" y="12" width="1200" height="2"/><rect x="0" y="18" width="1200" height="2"/>
  </g>
</svg>
