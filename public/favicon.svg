<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#240050" />
      <stop offset="70%" stop-color="#120024" />
      <stop offset="100%" stop-color="#0b001a" />
    </radialGradient>

    <!-- Vaporwave Sliced Sun Gradient -->
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffb96" />
      <stop offset="30%" stop-color="#ff9a3c" />
      <stop offset="70%" stop-color="#ff71ce" />
      <stop offset="100%" stop-color="#b967ff" />
    </linearGradient>

    <!-- Neon Shades Gradient -->
    <linearGradient id="shadesGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#01cdfe" />
      <stop offset="50%" stop-color="#b967ff" />
      <stop offset="100%" stop-color="#ff71ce" />
    </linearGradient>

    <!-- Cat Fur Gradient -->
    <linearGradient id="catFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffb96" />
      <stop offset="60%" stop-color="#ffd43f" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Win95/Cyber Badge -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#spaceGrad)" stroke="#ff71ce" stroke-width="6" />

  <!-- Vaporwave Sun in Background -->
  <g transform="translate(128, 105)">
    <path d="M -70 0 A 70 70 0 0 1 70 0 Z" fill="url(#sunGrad)" />
    <line x1="-70" y1="-12" x2="70" y2="-12" stroke="#120024" stroke-width="3.5" />
    <line x1="-65" y1="-26" x2="65" y2="-26" stroke="#120024" stroke-width="4.5" />
    <line x1="-55" y1="-42" x2="55" y2="-42" stroke="#120024" stroke-width="5.5" />
  </g>

  <!-- Cat Ears -->
  <polygon points="56,130 40,55 102,90" fill="url(#catFur)" stroke="#0b001a" stroke-width="5" stroke-linejoin="round" />
  <polygon points="60,118 50,68 94,92" fill="#ff71ce" />

  <polygon points="200,130 216,55 154,90" fill="url(#catFur)" stroke="#0b001a" stroke-width="5" stroke-linejoin="round" />
  <polygon points="196,118 206,68 162,92" fill="#ff71ce" />

  <!-- Cat Head Base -->
  <ellipse cx="128" cy="142" rx="72" ry="60" fill="url(#catFur)" stroke="#0b001a" stroke-width="6" />

  <!-- Cyber Sunglasses (Shades) -->
  <g>
    <rect x="116" y="126" width="24" height="6" rx="2" fill="#0b001a" />
    <path d="M 64 118 L 118 122 L 112 152 L 72 150 Z" fill="url(#shadesGrad)" stroke="#0b001a" stroke-width="5" stroke-linejoin="round" />
    <line x1="72" y1="124" x2="84" y2="146" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    
    <path d="M 138 122 L 192 118 L 184 150 L 144 152 Z" fill="url(#shadesGrad)" stroke="#0b001a" stroke-width="5" stroke-linejoin="round" />
    <line x1="146" y1="125" x2="158" y2="146" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Cute Cat Nose & Mouth -->
  <polygon points="128,162 122,156 134,156" fill="#ff71ce" stroke="#0b001a" stroke-width="2" />
  <path d="M 122 162 Q 116 172 128 174 Q 140 172 134 162" fill="none" stroke="#0b001a" stroke-width="3.5" stroke-linecap="round" />

  <!-- Whiskers -->
  <line x1="68" y1="160" x2="28" y2="154" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="68" y1="168" x2="30" y2="172" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="188" y1="160" x2="228" y2="154" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="188" y1="168" x2="226" y2="172" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
</svg>
